<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Alex Pokédex</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%231a1a1a'/><path d='M0,50 A50,50 0 0,1 100,50' fill='%23c8102e'/><path d='M0,50 A50,50 0 0,0 100,50' fill='%23f0f0f0'/><rect x='0' y='44' width='100' height='12' fill='%231a1a1a'/><circle cx='50' cy='50' r='14' fill='%231a1a1a'/><circle cx='50' cy='50' r='9' fill='%23f0f0f0'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <!-- Google Analytics 4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-NM0QZ0XJJK"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-NM0QZ0XJJK');
  </script>
</head>
<body>

  <div class="starfield" id="starfield"></div>

  <div class="app">

    <header class="header">
      <div class="dex-lights">
        <div class="dex-lens"><div class="dex-lens-inner"></div></div>
        <div class="dex-dots">
          <span class="dex-dot dex-dot-r"></span>
          <span class="dex-dot dex-dot-y"></span>
          <span class="dex-dot dex-dot-g"></span>
        </div>
      </div>
      <div class="dex-title">
        <h1 class="logo">Alex <span>Pokédex</span></h1>
        <p class="tagline">Pokémon Card Collector</p>
      </div>
    </header>

    <div class="dex-screen">

    <nav class="nav">
      <button class="nav-btn active" data-view="draw">Draw</button>
      <button class="nav-btn" data-view="collection">Collection</button>
    </nav>

    <!-- DRAW VIEW -->
    <section class="view draw-view active" id="drawView">
      <button class="motion-btn hidden" id="motionBtn">⟳ Enable Tilt</button>
      <div class="card-area">

        <div class="card-scene" id="cardScene">
          <div class="card-inner" id="cardInner">

            <!-- Card Back (decorative — shown first) -->
            <div class="card-face card-back" id="cardBack">
              <div class="back-pattern">
                <div class="back-border"></div>
                <div class="back-border inner"></div>
                <div class="pokeball">
                  <div class="pokeball-line"></div>
                  <div class="pokeball-center"></div>
                </div>
              </div>
            </div>

            <!-- Card Front (Pokemon card — revealed on flip) -->
            <div class="card-face card-front" id="cardFront">
              <img class="card-image" id="cardImage" src="" alt="">
              <div class="holo-overlay" id="holoOverlay"></div>
            </div>

          </div>
        </div>

        <!-- Hint -->
        <div class="card-hint" id="cardHint">
          <div class="hint-pulse"></div>
          <p>Tap card to reveal</p>
        </div>

        <!-- Loading -->
        <div class="card-loading hidden" id="cardLoading">
          <div class="spinner"></div>
          <p>Drawing a card…</p>
        </div>

        <!-- Card Info -->
        <div class="card-info hidden" id="cardInfo">
          <div class="card-name-row">
            <div class="card-name" id="cardName"></div>
            <button class="tts-btn" id="ttsBtn" title="Read name aloud">🔊</button>
          </div>
          <div class="card-meta">
            <span class="rarity-badge" id="rarityBadge"></span>
            <span class="set-name" id="setName"></span>
          </div>
          <div class="card-stats">
            <span id="cardType"></span>
            <span id="cardHp"></span>
          </div>
        </div>

        <!-- Actions: can claim -->
        <div class="card-actions hidden" id="cardActions">
          <button class="btn btn-claim" id="claimBtn">Add to Collection</button>
          <button class="btn btn-skip" id="skipBtn">Draw Another</button>
        </div>


      </div>
    </section>

    <!-- COLLECTION VIEW -->
    <section class="view collection-view" id="collectionView">
      <div class="coll-stats">
        <div class="coll-stat">
          <span class="coll-num" id="totalCards">0</span>
          <span class="coll-label">Cards</span>
        </div>
        <div class="coll-divider"></div>
        <div class="coll-stat">
          <span class="coll-num" id="totalRarities">0</span>
          <span class="coll-label">Rarities</span>
        </div>
      </div>

      <div id="emptyState" class="empty-state hidden">
        <div class="empty-icon">✦</div>
        <p>Your collection is empty</p>
        <p class="empty-sub">Draw cards to start collecting</p>
      </div>

      <div id="collectionTiers"></div>
    </section>

    </div>

  </div>

  <!-- Collection Card Lightbox -->
  <div class="coll-overlay hidden" id="collOverlay">
    <div class="coll-lightbox" id="collLightbox">
      <button class="coll-lb-close" id="collLbClose">✕</button>
      <div class="coll-lb-nav-row">
        <button class="coll-lb-arrow" id="collLbPrev">‹</button>
        <img class="coll-lb-img" id="collLbImg" src="" alt="">
        <button class="coll-lb-arrow" id="collLbNext">›</button>
      </div>
      <div class="coll-lb-info" id="collLbInfo"></div>
      <div class="coll-lb-footer">
        <span class="coll-lb-counter" id="collLbCounter"></span>
        <button class="coll-lb-remove" id="collLbRemove">Remove</button>
      </div>
    </div>
  </div>

  <div class="toast hidden" id="toast"></div>

  <!-- Feedback Widget -->
  <button class="feedback-fab" id="feedbackFab" aria-label="Send feedback">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
    </svg>
  </button>

  <div class="feedback-popup" id="feedbackPopup" role="dialog" aria-modal="true" aria-label="Feedback">
    <div class="feedback-popup-header">
      <span>Send Feedback</span>
      <button class="feedback-close" id="feedbackClose" aria-label="Close">✕</button>
    </div>
    <div class="feedback-popup-body">
      <p class="feedback-hint">Bug, suggestion, or just want to say hi? Let me know!</p>
      <div class="feedback-rating-group">
        <span class="feedback-rating-label">How fun is the app?</span>
        <div class="feedback-stars" id="feedbackStars">
          <button type="button" class="star-btn" data-value="1">1</button>
          <button type="button" class="star-btn" data-value="2">2</button>
          <button type="button" class="star-btn" data-value="3">3</button>
          <button type="button" class="star-btn" data-value="4">4</button>
          <button type="button" class="star-btn" data-value="5">5</button>
        </div>
        <span class="feedback-rating-hint" id="ratingHint">Tap to rate</span>
      </div>
      <textarea id="feedbackText" placeholder="Your feedback..." rows="3" maxlength="1000"></textarea>
      <input type="email" id="feedbackEmail" class="feedback-email" placeholder="Email (optional)" autocomplete="email">
      <div class="feedback-footer">
        <span class="feedback-char" id="feedbackChar">0 / 1000</span>
        <button class="feedback-submit" id="feedbackSubmit">Send</button>
      </div>
      <p class="feedback-status" id="feedbackStatus"></p>
    </div>
  </div>

  <script src="cards-data.js"></script>
  <script src="app.js"></script>
  <script>
  (function() {
    var SHEET_URL = 'https://script.google.com/macros/s/AKfycbwQCQ0s0clrB62Zy-noG8tBYJh0yU3DTHlSFUlGrJ4MHWNRM7Cspdqiy9AU2zv2K5Ph/exec';

    var fab          = document.getElementById('feedbackFab');
    var popup        = document.getElementById('feedbackPopup');
    var closeBtn     = document.getElementById('feedbackClose');
    var textarea     = document.getElementById('feedbackText');
    var emailEl      = document.getElementById('feedbackEmail');
    var charEl       = document.getElementById('feedbackChar');
    var submitBtn    = document.getElementById('feedbackSubmit');
    var statusEl     = document.getElementById('feedbackStatus');
    var starsEl      = document.getElementById('feedbackStars');
    var ratingHint   = document.getElementById('ratingHint');
    var selectedRating = 0;
    var ratingLabels = ['','Boring','OK','Fun','Really fun','Addictive!'];

    starsEl.addEventListener('click', function(e) {
      var btn = e.target.closest('.star-btn');
      if (!btn) return;
      selectedRating = parseInt(btn.dataset.value);
      starsEl.querySelectorAll('.star-btn').forEach(function(b) {
        b.classList.toggle('selected', parseInt(b.dataset.value) <= selectedRating);
      });
      ratingHint.textContent = selectedRating + ' — ' + ratingLabels[selectedRating];
    });

    fab.addEventListener('click', function() {
      var isOpen = popup.classList.toggle('open');
      fab.classList.toggle('active', isOpen);
      if (isOpen) setTimeout(function() { textarea.focus(); }, 50);
    });

    closeBtn.addEventListener('click', function() {
      popup.classList.remove('open');
      fab.classList.remove('active');
    });

    textarea.addEventListener('input', function() {
      charEl.textContent = textarea.value.length + ' / 1000';
    });

    submitBtn.addEventListener('click', function() {
      var msg = textarea.value.trim();
      if (!msg && !selectedRating) {
        statusEl.textContent = 'Please add a rating or message.';
        statusEl.className = 'feedback-status error';
        return;
      }
      submitBtn.disabled = true;
      submitBtn.textContent = 'Sending…';
      statusEl.textContent = '';
      statusEl.className = 'feedback-status';

      fetch(SHEET_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          rating: selectedRating || '',
          feedback: msg,
          email: emailEl.value.trim() || '',
          page: location.href,
          timestamp: new Date().toISOString()
        })
      }).then(function() {
        statusEl.textContent = 'Thanks! Feedback sent. ✓';
        statusEl.className = 'feedback-status success';
        textarea.value = ''; emailEl.value = '';
        charEl.textContent = '0 / 1000';
        selectedRating = 0;
        starsEl.querySelectorAll('.star-btn').forEach(function(b) { b.classList.remove('selected'); });
        ratingHint.textContent = 'Tap to rate';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Send';
        setTimeout(function() {
          popup.classList.remove('open');
          fab.classList.remove('active');
          statusEl.textContent = '';
          statusEl.className = 'feedback-status';
        }, 2000);
      }).catch(function() {
        statusEl.textContent = 'Something went wrong. Try again.';
        statusEl.className = 'feedback-status error';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Send';
      });
    });
  })();
  </script>
</body>
</html>
