<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Alex Pokédex</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%231a1a1a'/><path d='M0,50 A50,50 0 0,1 100,50' fill='%23c8102e'/><path d='M0,50 A50,50 0 0,0 100,50' fill='%23f0f0f0'/><rect x='0' y='44' width='100' height='12' fill='%231a1a1a'/><circle cx='50' cy='50' r='14' fill='%231a1a1a'/><circle cx='50' cy='50' r='9' fill='%23f0f0f0'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="starfield" id="starfield"></div>

  <div class="app">

    <header class="header">
      <div class="dex-lights">
        <div class="dex-lens"><div class="dex-lens-inner"></div></div>
        <div class="dex-dots">
          <span class="dex-dot dex-dot-r"></span>
          <span class="dex-dot dex-dot-y"></span>
          <span class="dex-dot dex-dot-g"></span>
        </div>
      </div>
      <div class="dex-title">
        <h1 class="logo">Alex <span>Pokédex</span></h1>
        <p class="tagline">Pokémon Card Collector</p>
      </div>
    </header>

    <div class="dex-screen">

    <nav class="nav">
      <button class="nav-btn active" data-view="draw">Draw</button>
      <button class="nav-btn" data-view="collection">Collection</button>
    </nav>

    <!-- DRAW VIEW -->
    <section class="view draw-view active" id="drawView">
      <button class="motion-btn hidden" id="motionBtn">⟳ Enable Tilt</button>
      <div class="card-area">

        <div class="card-scene" id="cardScene">
          <div class="card-inner" id="cardInner">

            <!-- Card Back (decorative — shown first) -->
            <div class="card-face card-back" id="cardBack">
              <div class="back-pattern">
                <div class="back-border"></div>
                <div class="back-border inner"></div>
                <div class="pokeball">
                  <div class="pokeball-line"></div>
                  <div class="pokeball-center"></div>
                </div>
              </div>
            </div>

            <!-- Card Front (Pokemon card — revealed on flip) -->
            <div class="card-face card-front" id="cardFront">
              <img class="card-image" id="cardImage" src="" alt="">
              <div class="holo-overlay" id="holoOverlay"></div>
            </div>

          </div>
        </div>

        <!-- Hint -->
        <div class="card-hint" id="cardHint">
          <div class="hint-pulse"></div>
          <p>Tap card to reveal</p>
        </div>

        <!-- Loading -->
        <div class="card-loading hidden" id="cardLoading">
          <div class="spinner"></div>
          <p>Drawing a card…</p>
        </div>

        <!-- Card Info -->
        <div class="card-info hidden" id="cardInfo">
          <div class="card-name-row">
            <div class="card-name" id="cardName"></div>
            <button class="tts-btn" id="ttsBtn" title="Read name aloud">🔊</button>
          </div>
          <div class="card-meta">
            <span class="rarity-badge" id="rarityBadge"></span>
            <span class="set-name" id="setName"></span>
          </div>
          <div class="card-stats">
            <span id="cardType"></span>
            <span id="cardHp"></span>
          </div>
        </div>

        <!-- Actions: can claim -->
        <div class="card-actions hidden" id="cardActions">
          <button class="btn btn-claim" id="claimBtn">Add to Collection</button>
          <button class="btn btn-skip" id="skipBtn">Draw Another</button>
        </div>


      </div>
    </section>

    <!-- COLLECTION VIEW -->
    <section class="view collection-view" id="collectionView">
      <div class="coll-stats">
        <div class="coll-stat">
          <span class="coll-num" id="totalCards">0</span>
          <span class="coll-label">Cards</span>
        </div>
        <div class="coll-divider"></div>
        <div class="coll-stat">
          <span class="coll-num" id="totalRarities">0</span>
          <span class="coll-label">Rarities</span>
        </div>
      </div>

      <div id="emptyState" class="empty-state hidden">
        <div class="empty-icon">✦</div>
        <p>Your collection is empty</p>
        <p class="empty-sub">Draw cards to start collecting</p>
      </div>

      <div id="collectionTiers"></div>
    </section>

    </div>

  </div>

  <!-- Collection Card Lightbox -->
  <div class="coll-overlay hidden" id="collOverlay">
    <div class="coll-lightbox" id="collLightbox">
      <button class="coll-lb-close" id="collLbClose">✕</button>
      <div class="coll-lb-nav-row">
        <button class="coll-lb-arrow" id="collLbPrev">‹</button>
        <img class="coll-lb-img" id="collLbImg" src="" alt="">
        <button class="coll-lb-arrow" id="collLbNext">›</button>
      </div>
      <div class="coll-lb-info" id="collLbInfo"></div>
      <div class="coll-lb-footer">
        <span class="coll-lb-counter" id="collLbCounter"></span>
        <button class="coll-lb-remove" id="collLbRemove">Remove</button>
      </div>
    </div>
  </div>

  <div class="toast hidden" id="toast"></div>

  <script src="cards-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
